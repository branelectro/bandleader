<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build-a-Band</title>
  <meta name="description" content="Start a local band from nothing. Recruit members, book basement shows, record demos, and climb the scene.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <div class="brand">BUILD-A-BAND</div>
    <div class="status" id="status"></div>
    <div class="advance" id="advance"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>

      <a class="coffee" href="https://buymeacoffee.com/branelectro" target="_blank" rel="noopener">☕ Buy me a coffee</a>
    </span>
